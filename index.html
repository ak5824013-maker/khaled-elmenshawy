<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازار العيال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<style>
  :root{
    --bg:#FAF6EE;
    --surface:#FFFFFF;
    --surface-2:#F1EBDD;
    --ink:#211D17;
    --ink-soft:#6E6455;
    --ink-faint:#A79C88;
    --line:#E7DFCB;
    --accent:#C97B4A;
    --accent-ink:#5C3013;
    --accent-soft:#F3E2D3;
    --teal:#5F8F86;
    --teal-soft:#E4EDE9;
    --pink:#C07E8B;
    --pink-soft:#F2E5E7;
    --danger:#B5544A;
    --danger-soft:#F3E2DE;
    --violet:#8D80B0;
    --violet-soft:#EAE6F0;
    --blue:#6E93A8;
    --blue-soft:#E5ECEF;
    --amber:#B9903F;
    --amber-soft:#F2ECD9;
    --shadow: 0 1px 2px rgba(33,29,23,.05), 0 8px 20px -12px rgba(33,29,23,.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{
    font-family:"Cairo","Segoe UI",Tahoma,sans-serif;
    color:var(--ink);
    direction:rtl;
    background:var(--bg);
    padding-bottom:96px;
  }
  h1,h2,h3,.display{
    font-family:"Cairo",sans-serif;
    font-weight:800;
    text-wrap:balance;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}

  header.site{ padding:28px 0 18px; }
  .brand-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo-img{
    width:54px;height:54px;border-radius:16px;
    object-fit:cover;
    box-shadow:var(--shadow);
    flex:none;
  }
  .brand h1{font-size:28px;margin:0;line-height:1.1;}
  .brand p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}
  .cart-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);
    font-size:14px;font-weight:700;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .cart-pill svg{width:18px;height:18px;color:var(--teal);flex:none;}

  .search-row{ padding:4px 0 14px; }
  .search-box{
    position:relative;display:flex;align-items:center;
  }
  .search-box svg{
    position:absolute;inset-inline-start:14px;width:18px;height:18px;color:var(--ink-faint);
  }
  .search-box input{
    width:100%;padding:12px 14px 12px 14px;padding-inline-start:42px;
    border-radius:14px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:inherit;font-size:14.5px;
    box-shadow:var(--shadow);
  }
  .search-box input:focus{ outline:2px solid var(--accent);outline-offset:1px; }
  .no-results{ text-align:center;color:var(--ink-faint);padding:48px 12px;font-size:14.5px; }

  .cats{ display:flex;gap:10px;overflow-x:auto;padding:4px 0 22px; scrollbar-width:none; }
  .cats::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    padding:9px 18px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:14px;font-weight:700;
    cursor:pointer;transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip.active{ background:var(--ink);border-color:var(--ink);color:var(--surface); }

  .grid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:16px;display:flex;flex-direction:column;gap:10px;
    box-shadow:var(--shadow);
  }
  .card .art{
    height:118px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:var(--tag-soft, var(--surface-2));
  }
  .card .art svg{width:56px;height:56px;color:var(--tag, var(--ink-soft));}
  .card .tag{
    align-self:flex-start;
    font-size:11.5px;font-weight:700;letter-spacing:.02em;
    padding:3px 10px;border-radius:999px;
    background:var(--tag-soft, var(--surface-2));color:var(--tag, var(--ink-soft));
  }
  .card h3{font-size:16px;margin:0;line-height:1.35;min-height:44px;}
  .card .price{ font-weight:800;font-size:17px;color:var(--ink); font-variant-numeric:tabular-nums; }
  .card .price span{font-size:12px;font-weight:600;color:var(--ink-faint);margin-inline-start:4px;}
  .card .code{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}

  .qty-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;}
  .stepper{ display:flex;align-items:center;gap:10px; background:var(--surface-2);border-radius:12px;padding:4px 8px; }
  .stepper button{
    width:26px;height:26px;border-radius:8px;border:none;background:var(--surface);
    color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 1px rgba(0,0,0,.06);
  }
  .stepper button:active{transform:scale(.94);}
  .stepper .n{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}
  .add-btn{
    border:none;border-radius:12px;padding:8px 16px;font-weight:800;font-size:13.5px;
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;
    transition:filter .12s ease;
  }
  .add-btn:hover{filter:brightness(1.05);}
  .add-btn.added{background:var(--teal);}

  .checkout-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -8px 24px -12px rgba(33,29,23,.2);
    padding:14px 0;transform:translateY(100%);transition:transform .25s ease;
  }
  .checkout-bar.show{transform:translateY(0);}
  .checkout-bar .inner{
    max-width:1000px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .checkout-bar .totals{font-size:14px;color:var(--ink-soft);}
  .checkout-bar .totals b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;}
  .go-btn{
    border:none;border-radius:14px;padding:13px 26px;font-weight:800;font-size:15px;
    background:var(--ink);color:var(--surface);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:8px;
  }
  .go-btn svg{width:16px;height:16px;}

  .overlay{
    position:fixed;inset:0;background:rgba(33,29,23,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    z-index:20;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  @media (min-width:640px){ .overlay{align-items:center;} }
  .sheet{
    background:var(--surface);width:100%;max-width:480px;
    border-radius:22px 22px 0 0;padding:24px;
    max-height:88vh;overflow-y:auto;
    transform:translateY(24px);transition:transform .2s ease;
    position:relative;
  }
  .overlay.show .sheet{transform:translateY(0);}
  @media (min-width:640px){ .sheet{border-radius:22px;margin-bottom:24px;} }
  .sheet h2{font-size:21px;margin:0 0 4px;}
  .sheet .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;}
  .line-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;
  }
  .line-item .li-name{font-weight:700;}
  .line-item .li-meta{color:var(--ink-faint);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .line-item .li-price{font-weight:800;font-variant-numeric:tabular-nums;}
  .sum-row{display:flex;justify-content:space-between;padding:14px 0 6px;font-weight:800;font-size:16px;}
  .sum-row span:last-child{font-variant-numeric:tabular-nums;}

  form .field{margin-top:14px;}
  form label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  form input{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:14.5px;
  }
  form input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .submit-btn{
    width:100%;margin-top:18px;border:none;border-radius:14px;padding:14px;
    background:var(--accent);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit;
  }
  .submit-btn:disabled{opacity:.6;cursor:default;}
  .close-btn{
    border:none;background:var(--surface-2);color:var(--ink-soft);
    width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer;
    position:absolute;left:16px;top:16px;
  }

  .error-box{
    background:var(--danger-soft);color:var(--danger);
    border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px;
  }

  .success{text-align:center;padding:8px 4px 4px;}
  .success .tick{
    width:64px;height:64px;border-radius:50%;background:var(--teal-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  }
  .success .tick svg{width:30px;height:30px;color:var(--teal);}
  .success h2{margin-bottom:6px;}
  .success p{color:var(--ink-soft);font-size:14px;line-height:1.7;margin:0 0 18px;}
  .again-btn{
    border:none;border-radius:12px;padding:11px 20px;font-weight:800;font-size:14px;
    background:var(--ink);color:var(--surface);cursor:pointer;font-family:inherit;
  }

  footer{text-align:center;color:var(--ink-faint);font-size:12px;padding:36px 0 12px;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap brand-row">
    <div class="brand">
      <img class="logo-img" src="logo.png" alt="بازار العيال">
      <div>
        <h1>بازار العيال</h1>
        <p>اختار الأصناف اللي عايزها وابعت الطلب</p>
      </div>
    </div>
    <div class="cart-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="cartCount">0 أصناف</span>
    </div>
  </div>

  <div class="wrap search-row">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="ابحث بالاسم أو الكود...">
    </div>
  </div>

  <div class="wrap cats" id="cats"></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer>بازار العيال · الأسعار بالجنيه المصري</footer>

<div class="checkout-bar" id="checkoutBar">
  <div class="inner">
    <div class="totals">الإجمالي<br><b id="barTotal">0 جنيه</b></div>
    <button class="go-btn" id="goCheckout">
      متابعة الطلب
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script src="products.js"></script>
<script>
const ICONS = {
  car: '<path d="M3 12l1.5-4.5A2 2 0 0 1 6.4 6h11.2a2 2 0 0 1 1.9 1.5L21 12"/><rect x="3" y="12" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>',
  blocks: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  teddy: '<circle cx="12" cy="11" r="4.3"/><circle cx="7" cy="6.3" r="2.1"/><circle cx="17" cy="6.3" r="2.1"/><path d="M6.6 15c-2 1-3.1 3-3.1 6h17c0-3-1.1-5-3.1-6"/>',
  heli: '<circle cx="12" cy="12" r="1.6"/><path d="M4 12h16M12 12V6M15 18l-3-4"/>',
  hover: '<rect x="5" y="10" width="14" height="4" rx="2"/><circle cx="8" cy="17" r="2.2"/><circle cx="16" cy="17" r="2.2"/>',
  micro: '<path d="M8 20h8"/><path d="M11 20v-3.5"/><rect x="9" y="13" width="4" height="3.5" rx="1"/><path d="M9 13l1.5-6h3L15 13"/><circle cx="11.5" cy="6" r="1.6"/>',
  xylo: '<rect x="3" y="6" width="18" height="2.4" rx="1.2"/><rect x="4.5" y="10.5" width="15" height="2.4" rx="1.2"/><rect x="6" y="15" width="12" height="2.4" rx="1.2"/>',
  baby: '<path d="M9 2h6M10 2v4.3a3 3 0 0 0-2 2.8V20a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V9.1a3 3 0 0 0-2-2.8V2"/><path d="M8 13h8"/>',
  makeup: '<path d="M14 2l3 3-8.3 8.3a2 2 0 0 1-1 .55L4 15l1.15-3.7a2 2 0 0 1 .55-1L14 2z"/><circle cx="18" cy="18" r="3"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="8.5" r="1.2"/><circle cx="8.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/>',
  tent: '<path d="M12 4l9 16H3L12 4z"/><path d="M12 4v16"/><path d="M7.5 13h9"/>',
  squishy: '<path d="M12 3c3 2 6 5 6 9a6 6 0 0 1-12 0c0-4 3-7 6-9z"/><circle cx="10" cy="12" r="1"/><circle cx="14" cy="12" r="1"/><path d="M10 15q2 1.4 4 0"/>',
  kitchen: '<path d="M4 9h16l-1.5 10a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 9z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/>',
  doctor: '<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M12 12v4M10 14h4"/>',
  costume: '<path d="M4 10c0-4 3.5-7 8-7s8 3 8 7c-2 1-4-1-4-3-1 2-3 3-4 3s-3-1-4-3c0 2-2 4-4 3z"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/>',
  clay: '<path d="M12 4c-3 3-6 6-6 10a6 6 0 0 0 12 0c0-4-3-7-6-10z"/><path d="M9 15c1 1 5 1 6 0"/>',
  dance: '<path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/><circle cx="18.5" cy="18.5" r="1.4"/>',
  electronic: '<rect x="3" y="7" width="18" height="11" rx="3"/><circle cx="8" cy="12.5" r="1.4"/><circle cx="16" cy="12.5" r="1.4"/><path d="M9 3l1.5 4M15 3l-1.5 4"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-.5-1.5-.5-2.5S14.5 15 16 15h1a4 4 0 0 0 4-4c0-4.5-4-8-9-8z"/><circle cx="7.5" cy="10.5" r="1.1"/><circle cx="9.5" cy="7" r="1.1"/><circle cx="14" cy="7" r="1.1"/><circle cx="16.5" cy="10.5" r="1.1"/>',
  misc: '<path d="M20 7L12 3 4 7l8 4 8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/>'
};

// بيانات المنتجات (603 صنف، 18 مجموعة) متحمّلة من ملف products.js
let activeCat = 'all';
let searchTerm = '';
const cart = {}; // id -> qty

function fmt(n){ return n.toLocaleString('en-US'); }

function renderCats(){
  const el = document.getElementById('cats');
  el.innerHTML = CATS.map(c => `<button class="chip ${c.id===activeCat?'active':''}" data-cat="${c.id}">${c.name}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.cat; renderCats(); renderGrid(); }));
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matchesSearch(p, term){
  if (!term) return true;
  return p.name.toLowerCase().includes(term) || p.code.toLowerCase().includes(term);
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const term = searchTerm.trim().toLowerCase();
  const items = PRODUCTS.filter(p => (activeCat === 'all' || p.cat === activeCat) && matchesSearch(p, term));

  if (items.length === 0){
    grid.innerHTML = `<div class="no-results">مفيش أصناف مطابقة للبحث</div>`;
    return;
  }

  grid.innerHTML = items.map(p => {
    const catInfo = CATS.find(c => c.id === p.cat);
    const qty = cart[p.key] || 0;
    return `
    <div class="card">
      <div class="art" style="--tag:var(${catInfo.color});--tag-soft:var(${catInfo.soft})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.icon]}</svg>
      </div>
      <span class="tag" style="--tag:var(${catInfo.color});--tag-soft:var(${catInfo.soft})">${escapeHtml(catInfo.name)}</span>
      <h3>${escapeHtml(p.name)}</h3>
      <div class="code">كود ${escapeHtml(p.code)}</div>
      <div class="qty-row">
        <div class="price">${fmt(p.price)}<span>ج.م</span></div>
        ${qty > 0 ? `
          <div class="stepper">
            <button data-act="dec" data-key="${p.key}">−</button>
            <span class="n">${qty}</span>
            <button data-act="inc" data-key="${p.key}">+</button>
          </div>
        ` : `<button class="add-btn" data-act="add" data-key="${p.key}">إضافة</button>`}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key, act = btn.dataset.act;
      if (act === 'add' || act === 'inc') cart[key] = (cart[key]||0) + 1;
      if (act === 'dec') { cart[key] = (cart[key]||0) - 1; if (cart[key] <= 0) delete cart[key]; }
      renderGrid();
      updateBar();
    });
  });
}

function cartTotal(){
  return Object.entries(cart).reduce((sum,[key,qty]) => sum + PRODUCTS.find(p=>p.key===key).price*qty, 0);
}
function cartCount(){
  return Object.values(cart).reduce((a,b)=>a+b,0);
}

function updateBar(){
  const bar = document.getElementById('checkoutBar');
  const count = cartCount();
  document.getElementById('cartCount').textContent = count + (count===1?' صنف':' أصناف');
  document.getElementById('barTotal').textContent = fmt(cartTotal()) + ' جنيه';
  bar.classList.toggle('show', count > 0);
}

function openOverlay(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
}

function renderCheckoutSheet(){
  const rows = Object.entries(cart).map(([key,qty]) => {
    const p = PRODUCTS.find(x=>x.key===key);
    return `<div class="line-item">
      <div><div class="li-name">${escapeHtml(p.name)}</div><div class="li-meta">${qty} × ${fmt(p.price)} ج.م</div></div>
      <div class="li-price">${fmt(p.price*qty)}</div>
    </div>`;
  }).join('');

  openOverlay(`
    <button class="close-btn" id="closeSheet">✕</button>
    <h2>تأكيد الطلب</h2>
    <p class="sub">راجع الأصناف واكتب بياناتك، وهنتواصل معاك لتأكيد التوصيل والدفع.</p>
    ${rows}
    <div class="sum-row"><span>الإجمالي</span><span>${fmt(cartTotal())} جنيه</span></div>
    <form id="orderForm">
      <div class="field">
        <label for="custName">الاسم</label>
        <input id="custName" required placeholder="اسمك">
      </div>
      <div class="field">
        <label for="custPhone">رقم التليفون</label>
        <input id="custPhone" required placeholder="01xxxxxxxxx" inputmode="tel">
      </div>
      <button class="submit-btn" type="submit" id="submitBtn">تأكيد الطلب</button>
      <div id="orderError"></div>
    </form>
  `);

  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('orderError');
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الإرسال...';
    errorBox.innerHTML = '';

    const payload = {
      customerName: document.getElementById('custName').value.trim(),
      customerPhone: document.getElementById('custPhone').value.trim(),
      items: Object.entries(cart).map(([key, qty]) => {
        const p = PRODUCTS.find(x => x.key === key);
        return { id: p.code, name: p.name, price: p.price, qty };
      }),
      total: cartTotal(),
    };

    try {
      const res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('server-error');
      renderSuccessSheet();
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'تأكيد الطلب';
      errorBox.innerHTML = '<div class="error-box">حصل خطأ في إرسال الطلب، حاول تاني أو كلمنا على الرقم مباشرة.</div>';
    }
  });
}

function renderSuccessSheet(){
  openOverlay(`
    <button class="close-btn" id="closeSheet">✕</button>
    <div class="success">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h2>تم استلام الطلب</h2>
      <p>هنتواصل معاك قريب لتأكيد التوصيل والدفع.</p>
      <button class="again-btn" id="resetBtn">تجربة طلب جديد</button>
    </div>
  `);
  document.getElementById('closeSheet').addEventListener('click', closeOverlay);
  document.getElementById('resetBtn').addEventListener('click', () => {
    Object.keys(cart).forEach(k => delete cart[k]);
    renderGrid(); updateBar(); closeOverlay();
  });
}

document.getElementById('goCheckout').addEventListener('click', renderCheckoutSheet);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeOverlay(); });

let searchDebounce;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchTerm = e.target.value;
    renderGrid();
  }, 120);
});

renderCats();
renderGrid();
updateBar();
</script>
</body>
</html>
